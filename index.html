<!DOCTYPE html>
<!-- made by 0simplecat with 💕 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0SimpleCat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&family=Poppins:wght@400;500;600;700&family=Audiowide&family=Inter:wght@400;600;700&family=Quicksand:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Space+Grotesk:wght@500;700&family=Rajdhani:wght@600;700&family=VT323&family=Press+Start+2P&family=Fraunces:wght@600;700&family=Bebas+Neue&family=Sora:wght@500;700&family=JetBrains+Mono:wght@400;500;700&family=Righteous&family=Comfortaa:wght@400;700&family=Creepster&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font: 'JetBrains Mono', monospace;
    --bg: linear-gradient(180deg,#eafbfd,#ffffff);
    --panel: rgba(255,255,255,0.62);
    --panel-border: rgba(38,194,212,0.35);
    --accent: #26c2d4;
    --accent-dim: #1a94a3;
    --text: #123b40;
    --text-dim: #5f8c92;
    --radius: 14px;
    --shadow: 0 8px 40px rgba(38,194,212,0.18);
    --blur: 10px;
    --border-style: solid;
    --name-transform: none;
    --tracking: 1px;
    --name-size: 19px;
    --img-render: auto;
    --cursor: auto;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family: var(--font);
    color:var(--text);
    overflow-x:hidden;
  }

  body{
    background: var(--bg);
    background-attachment: fixed;
    transition: background .4s ease, color .4s ease;
    cursor: var(--cursor, auto);
  }

  .orb{
    position:fixed;
    z-index:0;
    background: color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius:50%;
    filter: blur(16px);
    pointer-events:none;
  }
  .orb1{ width:220px; height:70px; top:8%; left:-10%; animation: floatOrb 40s linear infinite; }
  .orb2{ width:160px; height:55px; top:22%; left:-20%; animation: floatOrb 55s linear infinite; animation-delay:-15s; opacity:0.6; }
  .orb3{ width:280px; height:90px; top:70%; left:-15%; animation: floatOrb 65s linear infinite; animation-delay:-30s; opacity:0.5; }
  @keyframes floatOrb{
    from{ transform: translateX(0); }
    to{ transform: translateX(140vw); }
  }

  .card{
    position:relative;
    z-index:1;
    width:min(360px, 90vw);
    margin: 8vh auto 4vh;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-style: var(--border-style);
    border-radius:var(--radius);
    padding:28px 24px 24px;
    backdrop-filter: blur(var(--blur));
    box-shadow: var(--shadow);
    text-align:center;
    opacity:0;
    transform: translateY(14px) scale(0.98);
    animation: cardIn .7s cubic-bezier(.2,.7,.2,1) forwards;
    transition: background .4s ease, border-color .4s ease, box-shadow .4s ease, border-radius .4s ease;
  }
  @keyframes cardIn{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .reveal{
    opacity:0;
    transform: translateY(8px);
    animation: revealIn .55s ease forwards;
  }
  @keyframes revealIn{
    to{ opacity:1; transform: translateY(0); }
  }

  .avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    margin:0 auto 14px;
    object-fit:cover;
    border:2px solid var(--accent);
    box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
    image-rendering: var(--img-render);
  }

  .name{
    font-size:var(--name-size);
    letter-spacing:var(--tracking);
    text-transform: var(--name-transform);
    color:var(--text);
    margin:0 0 2px;
  }
  .name .cursor{
    display:inline-block;
    width:8px;
    background:var(--accent);
    margin-left:4px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .bio{
    font-size:12.5px;
    color:var(--text-dim);
    margin:6px 0 18px;
    line-height:1.5;
  }

  .quote{
    font-size:11.5px;
    color:var(--text-dim);
    font-style:italic;
    margin:0 0 16px;
    line-height:1.5;
    padding:0 6px;
  }

  .badges{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    font-size:10px;
    padding:3px 8px;
    border:1px solid var(--accent-dim);
    border-radius:20px;
    color:var(--accent-dim);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#22c55e;
    margin-right:5px;
    box-shadow: 0 0 5px #22c55e;
    transition: background .2s ease, box-shadow .2s ease;
  }
  .dot.idle{
    -webkit-mask-image: radial-gradient(circle 2.6px at 6px 2.3px, transparent 99%, #000 100%);
    mask-image: radial-gradient(circle 2.6px at 6px 2.3px, transparent 99%, #000 100%);
  }

  .music{
    margin-bottom:18px;
    border-radius:var(--radius);
    overflow:hidden;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:6px;
  }
  .link{
    display:block;
    padding:11px 14px;
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius:6px;
    color:var(--text);
    text-decoration:none;
    font-size:13px;
    letter-spacing:0.5px;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
    text-align:left;
    cursor:pointer;
  }
  .link::before{
    content: "▸ ";
    color:var(--accent-dim);
  }
  .link:hover{
    transform: translateX(4px);
    border-color:var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }

  .footer{
    margin-top:22px;
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:1px;
  }

  .views{
    margin-top:6px;
    font-size:10px;
    color:var(--accent-dim);
  }

  .clock-widget{
    position:fixed;
    top:16px;
    left:16px;
    z-index:30;
    padding:9px 12px;
    border-radius:10px;
    border:1px solid var(--panel-border);
    background:var(--panel);
    backdrop-filter: blur(var(--blur));
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
  }

  .boot-overlay{
    position:fixed;
    inset:0;
    z-index:60;
    background:var(--panel);
    backdrop-filter: blur(var(--blur));
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:1;
    transition:opacity .4s ease;
  }
  .boot-overlay.hidden{
    opacity:0;
    pointer-events:none;
  }
  .boot-text{
    font-family: var(--font);
    color:var(--accent);
    font-size:14px;
    letter-spacing:2px;
    text-transform:uppercase;
  }

  .countdown{
    font-size:11px;
    color:var(--accent-dim);
    margin:0 0 16px;
  }

  .menu-btn{
    position:fixed;
    top:16px;
    right:16px;
    z-index:30;
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid var(--panel-border);
    background:var(--panel);
    backdrop-filter: blur(var(--blur));
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    cursor:pointer;
  }
  .menu-btn span{
    display:block;
    width:18px;
    height:2px;
    background:var(--text);
    border-radius:2px;
  }

  .menu-panel{
    position:fixed;
    top:64px;
    right:16px;
    z-index:30;
    width:240px;
    max-height:70vh;
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    backdrop-filter: blur(var(--blur));
    box-shadow: var(--shadow);
    padding:6px;
    display:none;
  }
  .menu-panel.open{ display:block; }

  .menu-group + .menu-group{
    border-top:1px solid color-mix(in srgb, var(--accent) 20%, transparent);
    margin-top:4px;
    padding-top:4px;
  }

  .menu-group-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:8px 6px;
    cursor:pointer;
  }
  .menu-group-header .arrow{
    transition: transform .2s ease;
    color:var(--accent-dim);
  }
  .menu-group-header.open .arrow{
    transform: rotate(180deg);
  }

  .menu-options{
    display:none;
    padding:2px 2px 8px;
  }
  .menu-options.open{ display:block; }

  .menu-option-row{
    display:flex;
    align-items:center;
    gap:4px;
    margin-bottom:4px;
  }
  .menu-option{
    flex:1;
    display:block;
    width:100%;
    text-align:left;
    padding:8px 10px;
    border:1px solid transparent;
    border-radius:8px;
    background:transparent;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    cursor:pointer;
  }
  .menu-option:hover{
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .menu-option.active{
    border-color:var(--accent);
    color:var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .song-link{
    flex-shrink:0;
    width:28px;
    height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:8px;
    text-decoration:none;
    font-size:13px;
    color:var(--accent-dim);
  }
  .song-link:hover{
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }

  .modal-overlay{
    position:fixed;
    inset:0;
    z-index:50;
    background:rgba(0,0,0,0.5);
    display:none;
    align-items:center;
    justify-content:center;
  }
  .modal-overlay.open{ display:flex; }
  .modal-box{
    position:relative;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    backdrop-filter: blur(var(--blur));
    box-shadow: var(--shadow);
    padding:26px 30px;
    text-align:center;
    min-width:220px;
  }
  .modal-title{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:var(--text-dim);
    margin:0 0 8px;
  }
  .modal-username{
    font-size:19px;
    color:var(--accent);
    margin:0 0 16px;
    font-weight:600;
  }
  .modal-copy{
    background:var(--accent);
    color:#0a0a0a;
    border:none;
    padding:8px 18px;
    border-radius:8px;
    font-family:'JetBrains Mono', monospace;
    cursor:pointer;
    font-size:12px;
  }
  .modal-close{
    position:absolute;
    top:8px;
    right:10px;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:14px;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<div class="boot-overlay hidden" id="bootOverlay">
  <p class="boot-text" id="bootText">BOOTING...</p>
</div>

<div class="clock-widget" id="clockWidget">Hanoi --:--</div>

<button class="menu-btn" id="menuBtn" aria-label="Menu">

</button>

</div>

<div class="card">
  <img class="avatar reveal" style="animation-delay:.15s" src="avatar.jpg" alt="avatar">

  <p class="name reveal" style="animation-delay:.25s" id="typedName"><span class="cursor">&nbsp;</span></p>

  <p class="bio reveal" style="animation-delay:.33s" id="bioText">18 y/o · Hanoi<br>developer / gamer / designer</p>

  <div class="badges reveal" style="animation-delay:.4s">
    <span class="badge"><span class="dot"></span><span id="onlineLabel">online</span></span>
    <span class="badge">🇻🇳 VN</span>
  </div>

  </div>

<script>
  function ytSearch(q){ return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q); }
  function cursorSVG(inner, size, hotX, hotY){
    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='" + size + "' height='" + size + "' viewBox='0 0 " + size + " " + size + "'>" + inner + "</svg>";
    return "url(\"data:image/svg+xml," + encodeURIComponent(svg) + "\") " + hotX + " " + hotY + ", auto";
  }

  // ambient effect layer (falling petals, stars, etc — varies per theme)
  const fxCanvas = document.createElement('canvas');
  fxCanvas.style.cssText = 'position:fixed;inset:0;z-index:4;pointer-events:none;';
  document.body.appendChild(fxCanvas);
  const fx = fxCanvas.getContext('2d');
  function resizeFx(){ fxCanvas.width = window.innerWidth; fxCanvas.height = window.innerHeight; }
  resizeFx();
  window.addEventListener('resize', resizeFx);

  let fxParticles = [];
  let fxType = null;

  function makeParticle(type){
    const w = fxCanvas.width, h = fxCanvas.height;
    if(type === 'petals'){
      return { x: Math.random()*w, y: Math.random()*h, r: 4+Math.random()*4,
        speedY: 0.6+Math.random()*0.8, drift: Math.random()*Math.PI*2, sway: 0.5+Math.random(),
        rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*2, color: Math.random()>0.5 ? '#ffb7d1' : '#ffd4e6' };
    }
    if(type === 'stars'){
      return { x: Math.random()*w, y: Math.random()*h, r: 0.6+Math.random()*1.4,
        tw: Math.random()*Math.PI*2, twSpeed: 0.02+Math.random()*0.03 };
    }
    if(type === 'matrix'){
      return { x: Math.random()*w, y: Math.random()*h, speedY: 2+Math.random()*3, len: 10+Math.random()*20 };
    }
    if(type === 'bubbles'){
      return { x: Math.random()*w, y: h+Math.random()*h, r: 2+Math.random()*4,
        speedY: -(0.5+Math.random()*1), speedX: (Math.random()-0.5)*0.3 };
    }
    if(type === 'bats'){
      return { x: Math.random()*w, y: Math.random()*h*0.5, speedX: (Math.random()>0.5?1:-1)*(0.5+Math.random()),
        speedY: (Math.random()-0.5)*0.3, size: 8+Math.random()*6, wing: Math.random()*10 };
    }
    if(type === 'pixels'){
      return { x: Math.random()*w, y: Math.random()*h, size: 3+Math.random()*3,
        speedY: 0.3+Math.random()*0.5, color: ['#fbbf24','#f5f5ff','#22c55e'][Math.floor(Math.random()*3)] };
    }
    if(type === 'sparkles-gold' || type === 'sparkles-neon'){
      const colors = type === 'sparkles-gold' ? ['#ffd700','#f2e9d0'] : ['#00e5ff','#ff2bd6'];
      return { x: Math.random()*w, y: Math.random()*h, r: 1+Math.random()*2,
        tw: Math.random()*Math.PI*2, twSpeed: 0.03+Math.random()*0.05,
        speedY: -(0.1+Math.random()*0.2), color: colors[Math.floor(Math.random()*colors.length)] };
    }
    if(type === 'dots'){
      return { x: Math.random()*w, y: Math.random()*h, r: 1+Math.random()*1.5,
        speedX: (Math.random()-0.5)*0.4, speedY: (Math.random()-0.5)*0.4, color:'#3b82f6' };
    }
    if(type === 'speedlines'){
      return { x: Math.random()*w, y: Math.random()*h, len: 40+Math.random()*80,
        speedX: -(6+Math.random()*8), color: Math.random()>0.5 ? 'rgba(255,255,255,0.5)' : 'rgba(239,68,68,0.5)' };
    }
    if(type === 'leaves'){
      return { x: Math.random()*w, y: Math.random()*h, r: 4+Math.random()*4,
        speedY: 0.5+Math.random()*0.7, drift: Math.random()*Math.PI*2, sway: 0.5+Math.random(),
        rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*2,
        color: Math.random()>0.5 ? '#66bb6a' : '#d4a574' };
    }
    if(type === 'confetti'){
      const colors = ['#ec4899','#facc15','#3b82f6','#22c55e','#a78bfa'];
      return { x: Math.random()*w, y: Math.random()*h, size: 4+Math.random()*3,
        speedY: 0.8+Math.random()*1, rot: Math.random()*360, rotSpeed: (Math.random()-0.5)*6,
        color: colors[Math.floor(Math.random()*colors.length)] };
    }
    if(type === 'paint'){
      const colors = ['#14b8a6','#f9a8d4','#fde68a','#93c5fd'];
      return { x: Math.random()*w, y: Math.random()*h, r: 8+Math.random()*14,
        speedX: (Math.random()-0.5)*0.15, speedY: (Math.random()-0.5)*0.15,
        color: colors[Math.floor(Math.random()*colors.length)] };
    }
    if(type === 'spray'){
      return { x: Math.random()*w, y: h+Math.random()*40, r: 1+Math.random()*1.5,
        speedY: -(0.4+Math.random()*0.8), speedX: (Math.random()-0.5)*0.4,
        color: Math.random()>0.5 ? '#facc15' : '#f5f5f5' };
    }
    if(type === 'grid'){
      return { y: Math.random()*h, speedY: 1+Math.random()*1.5, alpha: 0.15+Math.random()*0.25 };
    }
    return { x: Math.random()*w, y: Math.random()*h };
  }

  function setEffect(type){
    fxType = type || null;
    const counts = { petals:26, stars:80, matrix:36, bubbles:22, bats:6, pixels:30,
      'sparkles-gold':40, 'sparkles-neon':40, dots:26, speedlines:14, leaves:22, confetti:30, paint:10, spray:24, grid:8 };
    fxParticles = type ? Array.from({length: counts[type] || 20}, ()=> makeParticle(type)) : [];
  }

  function drawFx(){
    fx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    const w = fxCanvas.width, h = fxCanvas.height;
    if(fxType === 'petals'){
      fxParticles.forEach(p=>{
        p.y += p.speedY;
        p.x += Math.sin(p.y*0.02 + p.drift) * p.sway * 0.5;
        p.rot += p.rotSpeed;
        if(p.y > h+10){ p.y = -10; p.x = Math.random()*w; }
        fx.save();
        fx.translate(p.x, p.y);
        fx.rotate(p.rot * Math.PI/180);
        fx.fillStyle = p.color;
        fx.beginPath();
        fx.ellipse(0, 0, p.r, p.r*0.6, 0, 0, Math.PI*2);
        fx.fill();
        fx.restore();
      });
    } else if(fxType === 'stars'){
      fxParticles.forEach(p=>{
        p.tw += p.twSpeed;
        fx.fillStyle = `rgba(255,255,255,${0.4 + Math.sin(p.tw)*0.4})`;
        fx.beginPath();
        fx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        fx.fill();

        fx.stroke();
      });
    } else if(fxType === 'bubbles'){
      fx.strokeStyle = 'rgba(255,255,255,0.6)';
      fxParticles.forEach(p=>{
        p.y += p.speedY;
        p.x += p.speedX;
        if(p.y < -10){ p.y = h+10; p.x = Math.random()*w; }
        fx.beginPath();
        fx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        fx.stroke();
      });
    } else if(fxType === 'bats'){
      fx.fillStyle = '#1a0a00';
      fxParticles.forEach(p=>{
        p.x += p.speedX;
        p.wing += 0.3;
        if(p.x < -20) p.x = w+20;
        if(p.x > w+20) p.x = -20;
        const flap = Math.sin(p.wing) * p.size * 0.5;
        fx.beginPath();
        fx.moveTo(p.x, p.y);
        fx.lineTo(p.x - p.size, p.y - flap);
        fx.lineTo(p.x - p.size*0.3, p.y);
        fx.lineTo(p.x + p.size*0.3, p.y);
        fx.lineTo(p.x + p.size, p.y - flap);
        fx.closePath();
        fx.fill();
      });
    } else if(fxType === 'pixels'){
      fxParticles.forEach(p=>{
        p.y += p.speedY;
        if(p.y > h+10) p.y = -10;

        fx.fillRect(p.x, p.y, p.size, p.size);
      });
    } else if(fxType === 'pixels'){
      fxParticles.forEach(p=>{
        p.y += p.speedY;
        if(p.y > h+10) p.y = -10;
        fx.fillStyle = p.color;
        fx.fillRect(p.x, p.y, p.size, p.size);

        if(p.y < -5) p.y = h+5;

        fx.beginPath();

        fx.fill();
        fx.globalAlpha = 1;
      });
    } else if(fxType === 'dots'){
      fxParticles.forEach(p=>{
        p.x += p.speedX; p.y += p.speedY;
        if(p.x < 0) p.x = w; if(p.x > w) p.x = 0;
        if(p.y < 0) p.y = h; if(p.y > h) p.y = 0;
        fx.fillStyle = p.color;
        fx.globalAlpha = 0.5;
        fx.beginPath();
        fx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        fx.fill();
        fx.globalAlpha = 1;
      });
    } else if(fxType === 'speedlines'){
      fxParticles.forEach(p=>{
        p.x += p.speedX;
        if(p.x < -p.len){ p.x = w+p.len; p.y = Math.random()*h; }
        fx.strokeStyle = p.color;
        fx.lineWidth = 2;
        fx.beginPath();
        fx.moveTo(p.x, p.y);
        fx.lineTo(p.x + p.len, p.y);
        fx.stroke();
      });
    } else if(fxType === 'leaves'){

        fx.rotate(p.rot * Math.PI/180);
        fx.fillStyle = p.color;
        fx.beginPath();
        fx.ellipse(0, 0, p.r, p.r*0.5, 0, 0, Math.PI*2);
        fx.fill();
        fx.restore();
      });
    } else if(fxType === 'confetti'){
      fxParticles.forEach(p=>{

      });
    } else if(fxType === 'spray'){
      fxParticles.forEach(p=>{
        p.y += p.speedY; p.x += p.speedX;

        fx.beginPath();
        fx.arc(p.x, p.y, p.r, 0, Math.PI*2);

    } else if(fxType === 'grid'){

        fx.moveTo(0, p.y);

  function renderQuote(){
    const q = QUOTES[Math.floor(Math.random() * QUOTES.length)];
    document.getElementById('quoteText').textContent = '"' + q.t + '" — ' + q.s;
  }

  let currentThemeId = null;
  let currentSound = { type:'sine', freq:600, dur:0.06 };

  function applyTheme(id){
    const t = THEMES[id];
    if(!t) return;
    currentThemeId = id;
    const r = document.documentElement.style;
    r.setProperty('--font', t.font);
    r.setProperty('--bg', t.bg);
    r.setProperty('--panel', t.panel);
    r.setProperty('--panel-border', t.panelBorder);
    r.setProperty('--accent', t.accent);
    r.setProperty('--accent-dim', t.accentDim);
    r.setProperty('--text', t.text);
    r.setProperty('--text-dim', t.textDim);
    r.setProperty('--radius', t.radius);
    r.setProperty('--shadow', t.shadow);
    r.setProperty('--blur', t.blur);
    r.setProperty('--border-style', t.borderStyle || 'solid');
    r.setProperty('--name-transform', t.transform || 'none');
    r.setProperty('--tracking', t.tracking || '1px');
    r.setProperty('--name-size', t.nameSize || '19px');
    r.setProperty('--img-render', t.pixelated ? 'pixelated' : 'auto');
    r.setProperty('--cursor', t.cursor || 'auto');
    setEffect(t.effect || null);
    currentSound = t.sound || { type:'sine', freq:600, dur:0.06 };
    document.querySelectorAll('#themeList .menu-option').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.id === id);
    });
  }

  let currentViews = 0;
  let currentStatus = 'offline';
  function setStatusDot(status){
    currentStatus = status;
    const colors = {online:'#22c55e', idle:'#eab308', dnd:'#ef4444', offline:'#6b7280'};
    const c = colors[status] || colors.offline;
    const dot = document.querySelector('.dot');
    dot.style.background = c;
    dot.style.boxShadow = '0 0 5px ' + c;
    dot.classList.toggle('idle', status === 'idle');
    const l = I18N[document.documentElement.lang] || I18N.en;
    document.getElementById('onlineLabel').textContent = l.status[status] || l.status.offline;
  }

  function applyLanguage(code){
    const l = I18N[code] || I18N.en;
    document.documentElement.lang = code;
    document.getElementById('bioText').innerHTML = l.bio;
    document.getElementById('footerText').textContent = l.footer;
    document.getElementById('viewCount').textContent = l.views + currentViews;
    document.getElementById('styleHeaderLabel').textContent = l.style;
    document.getElementById('langHeaderLabel').textContent = l.language;
    document.getElementById('onlineLabel').textContent = l.status[currentStatus] || l.status.offline;
    document.querySelectorAll('#langList .menu-option').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.id === code);
    });
    localStorage.setItem('site_lang', code);
  }

  const themeListEl = document.getElementById('themeList');
  Object.keys(THEMES).forEach(id=>{
    const t = THEMES[id];
    const row = document.createElement('div');
    row.className = 'menu-option-row';

    const btn = document.createElement('button');
    btn.className = 'menu-option';
    btn.dataset.id = id;
    btn.textContent = t.label;
    btn.onclick = ()=> switchTheme(id);

    const song = document.createElement('a');
    song.className = 'song-link';
    song.href = t.song;
    song.target = '_blank';
    song.title = t.label + ' theme song';
    song.textContent = '🎵';
    song.onclick = (e)=> e.stopPropagation();

    row.appendChild(btn);
    row.appendChild(song);
    themeListEl.appendChild(row);
  });

  const langListEl = document.getElementById('langList');
  Object.keys(I18N).forEach(code=>{
    const btn = document.createElement('button');
    btn.className = 'menu-option';
    btn.dataset.id = code;
    btn.textContent = I18N[code].name;
    btn.onclick = ()=> applyLanguage(code);
    langListEl.appendChild(btn);
  });

  document.getElementById('menuBtn').onclick = ()=>{
    document.getElementById('menuPanel').classList.toggle('open');
  };

  function setupCollapsible(headerId, optionsId){
    const header = document.getElementById(headerId);
    const options = document.getElementById(optionsId);
    header.onclick = ()=>{
      header.classList.toggle('open');
      options.classList.toggle('open');
    };
  }
  setupCollapsible('styleHeader', 'themeList');
  setupCollapsible('langHeader', 'langList');

  let soundEnabled = localStorage.getItem('site_sound') === 'on';
  document.getElementById('soundState').textContent = soundEnabled ? 'On' : 'Off';
  let audioCtx;
  function playClick(){
    if(!soundEnabled) return;
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = currentSound.type;
    osc.frequency.value = currentSound.freq;
    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + currentSound.dur);
    osc.start();
    osc.stop(audioCtx.currentTime + currentSound.dur);
  }
  document.getElementById('soundToggleBtn').onclick = ()=>{
    soundEnabled = !soundEnabled;
    localStorage.setItem('site_sound', soundEnabled ? 'on' : 'off');
    document.getElementById('soundState').textContent = soundEnabled ? 'On' : 'Off';
  };
  document.querySelectorAll('.link').forEach(el=> el.addEventListener('click', playClick));

  function updateClock(){
    const time = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Ho_Chi_Minh', hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date());
    document.getElementById('clockWidget').textContent = 'Hanoi ' + time;
  }
  updateClock();
  setInterval(updateClock, 15000);

  // countdown target — change COUNTDOWN_MONTH_DAY (MM-DD) to your birthday
  const COUNTDOWN_MONTH_DAY = "12-31";
  const COUNTDOWN_LABEL = "New Year";
  function updateCountdown(){
    const now = new Date();
    let target = new Date(now.getFullYear() + "-" + COUNTDOWN_MONTH_DAY + "T00:00:00");
    if(target < now) target.setFullYear(target.getFullYear() + 1);
    const diffMs = target - now;
    const days = Math.floor(diffMs / 86400000);
    const hours = Math.floor((diffMs % 86400000) / 3600000);
    document.getElementById('countdownText').textContent = '🎉 ' + COUNTDOWN_LABEL + ' in ' + days + 'd ' + hours + 'h';
  }
  updateCountdown();
  setInterval(updateCountdown, 60000);

  function switchTheme(id){
    document.getElementById('bootText').textContent = THEMES[id].label.toUpperCase() + ' — LOADING...';
    document.getElementById('bootOverlay').classList.remove('hidden');
    setTimeout(()=>{
      applyTheme(id);
      setTimeout(()=> document.getElementById('bootOverlay').classList.add('hidden'), 300);
    }, 300);
  }

  const themeIds = Object.keys(THEMES);
  const initialThemeId = themeIds[Math.floor(Math.random()*themeIds.length)];
  applyTheme(initialThemeId);

  const savedLang = localStorage.getItem('site_lang');
  const browserLang = (navigator.language || 'en').split('-')[0];
  applyLanguage((savedLang && I18N[savedLang]) ? savedLang : (I18N[browserLang] ? browserLang : 'en'));

  renderQuote();

  const nameText = "0SimpleCat";
  const nameEl = document.getElementById('typedName');
  let i = 0;
  function typeChar(){
    if(i < nameText.length){
      nameEl.insertBefore(document.createTextNode(nameText[i]), nameEl.lastElementChild);
      i++;
      setTimeout(typeChar, 90);
    }
  }
  setTimeout(typeChar, 250);

  const DISCORD_ID = "779217047220650005";
  setStatusDot('offline');
  function fetchStatus(){
    fetch('https://api.lanyard.rest/v1/users/' + DISCORD_ID, { cache: 'no-store' })
      .then(res=>res.json())
      .then(data=>{
        if(data.success) setStatusDot(data.data.discord_status);
      })
      .catch(()=> setStatusDot('offline'));
  }
  fetchStatus();
  setInterval(fetchStatus, 20000);

  const discordModal = document.getElementById('discordModal');
  document.getElementById('discordLink').onclick = ()=> discordModal.classList.add('open');
  document.getElementById('closeDiscordModal').onclick = ()=> discordModal.classList.remove('open');
  discordModal.addEventListener('click', (e)=>{ if(e.target === discordModal) discordModal.classList.remove('open'); });
  document.getElementById('copyDiscordBtn').onclick = ()=>{
    navigator.clipboard.writeText('khoaaaabeo').then(()=>{
      const btn = document.getElementById('copyDiscordBtn');
      const old = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(()=> btn.textContent = old, 1500);
    });
  };

  currentViews = localStorage.getItem('bio_views');
  currentViews = currentViews ? parseInt(currentViews) + 1 : 1;
  localStorage.setItem('bio_views', currentViews);
  document.getElementById('viewCount').textContent = (I18N[document.documentElement.lang] || I18N.en).views + currentViews;
</script>
