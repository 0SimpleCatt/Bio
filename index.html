<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0SimpleCat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@400;600&family=Poppins:wght@400;500;600;700&family=Audiowide&family=Inter:wght@400;600;700&family=Quicksand:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Space+Grotesk:wght@500;700&family=Rajdhani:wght@600;700&family=VT323&family=Press+Start+2P&family=Fraunces:wght@600;700&family=Bebas+Neue&family=Sora:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --font: 'JetBrains Mono', monospace;
    --bg: linear-gradient(180deg,#eafbfd,#ffffff);
    --panel: rgba(255,255,255,0.62);
    --panel-border: rgba(38,194,212,0.35);
    --accent: #26c2d4;
    --accent-dim: #1a94a3;
    --text: #123b40;
    --text-dim: #5f8c92;
    --radius: 14px;
    --shadow: 0 8px 40px rgba(38,194,212,0.18);
    --blur: 10px;
    --border-style: solid;
    --name-transform: none;
    --tracking: 1px;
    --name-size: 19px;
    --img-render: auto;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family: var(--font);
    color:var(--text);
    overflow-x:hidden;
  }

  body{
    background: var(--bg);
    background-attachment: fixed;
    transition: background .4s ease, color .4s ease;
  }

  .orb{
    position:fixed;
    z-index:0;
    background: color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius:50%;
    filter: blur(16px);
    pointer-events:none;
  }
  .orb1{ width:220px; height:70px; top:8%; left:-10%; animation: floatOrb 40s linear infinite; }
  .orb2{ width:160px; height:55px; top:22%; left:-20%; animation: floatOrb 55s linear infinite; animation-delay:-15s; opacity:0.6; }
  .orb3{ width:280px; height:90px; top:70%; left:-15%; animation: floatOrb 65s linear infinite; animation-delay:-30s; opacity:0.5; }
  @keyframes floatOrb{
    from{ transform: translateX(0); }
    to{ transform: translateX(140vw); }
  }

  .card{
    position:relative;
    z-index:1;
    width:min(360px, 90vw);
    margin: 8vh auto 4vh;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-style: var(--border-style);
    border-radius:var(--radius);
    padding:28px 24px 24px;
    backdrop-filter: blur(var(--blur));
    box-shadow: var(--shadow);
    text-align:center;
    opacity:0;
    transform: translateY(14px) scale(0.98);
    animation: cardIn .7s cubic-bezier(.2,.7,.2,1) forwards;
    transition: background .4s ease, border-color .4s ease, box-shadow .4s ease, border-radius .4s ease;
  }
  @keyframes cardIn{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .reveal{
    opacity:0;
    transform: translateY(8px);
    animation: revealIn .55s ease forwards;
  }
  @keyframes revealIn{
    to{ opacity:1; transform: translateY(0); }
  }

  .avatar{
    width:88px;
    height:88px;
    border-radius:50%;
    margin:0 auto 14px;
    object-fit:cover;
    border:2px solid var(--accent);
    box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent);
    image-rendering: var(--img-render);
  }

  .name{
    font-size:var(--name-size);
    letter-spacing:var(--tracking);
    text-transform: var(--name-transform);
    color:var(--text);
    margin:0 0 2px;
  }
  .name .cursor{
    display:inline-block;
    width:8px;
    background:var(--accent);
    margin-left:4px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .bio{
    font-size:12.5px;
    color:var(--text-dim);
    margin:6px 0 18px;
    line-height:1.5;
  }

  .badges{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    font-size:10px;
    padding:3px 8px;
    border:1px solid var(--accent-dim);
    border-radius:20px;
    color:var(--accent-dim);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#22c55e;
    margin-right:5px;
    box-shadow: 0 0 5px #22c55e;
  }

  .music{
    margin-bottom:18px;
    border-radius:var(--radius);
    overflow:hidden;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:6px;
  }
  .link{
    display:block;
    padding:11px 14px;
    background: color-mix(in srgb, var(--accent) 7%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius:6px;
    color:var(--text);
    text-decoration:none;
    font-size:13px;
    letter-spacing:0.5px;
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
    text-align:left;
  }
  .link::before{
    content: "▸ ";
    color:var(--accent-dim);
  }
  .link:hover{
    transform: translateX(4px);
    border-color:var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
  }

  .footer{
    margin-top:22px;
    font-size:10px;
    color:var(--text-dim);
    letter-spacing:1px;
  }

  .views{
    margin-top:6px;
    font-size:10px;
    color:var(--accent-dim);
  }

  .menu-btn{
    position:fixed;
    top:16px;
    right:16px;
    z-index:30;
    width:40px;
    height:40px;
    border-radius:10px;
    border:1px solid var(--panel-border);
    background:var(--panel);
    backdrop-filter: blur(var(--blur));
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    cursor:pointer;
  }
  .menu-btn span{
    display:block;
    width:18px;
    height:2px;
    background:var(--text);
    border-radius:2px;
  }

  .menu-panel{
    position:fixed;
    top:64px;
    right:16px;
    z-index:30;
    width:230px;
    max-height:70vh;
    overflow-y:auto;
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:12px;
    backdrop-filter: blur(var(--blur));
    box-shadow: var(--shadow);
    padding:6px;
    display:none;
  }
  .menu-panel.open{ display:block; }

  .menu-group + .menu-group{
    border-top:1px solid color-mix(in srgb, var(--accent) 20%, transparent);
    margin-top:4px;
    padding-top:4px;
  }

  .menu-group-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    padding:8px 6px;
    cursor:pointer;
  }
  .menu-group-header .arrow{
    transition: transform .2s ease;
    color:var(--accent-dim);
  }
  .menu-group-header.open .arrow{
    transform: rotate(180deg);
  }

  .menu-options{
    display:none;
    padding:2px 2px 8px;
  }
  .menu-options.open{ display:block; }

  .menu-option{
    display:block;
    width:100%;
    text-align:left;
    padding:8px 10px;
    margin-bottom:4px;
    border:1px solid transparent;
    border-radius:8px;
    background:transparent;
    color:var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    cursor:pointer;
  }
  .menu-option:hover{
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .menu-option.active{
    border-color:var(--accent);
    color:var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
  }
</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>

<button class="menu-btn" id="menuBtn" aria-label="Menu">
  <span></span><span></span><span></span>
</button>

<div class="menu-panel" id="menuPanel">
  <div class="menu-group">
    <button class="menu-group-header" id="styleHeader">
      <span id="styleHeaderLabel">Style</span><span class="arrow">▾</span>
    </button>
    <div class="menu-options" id="themeList"></div>
  </div>
  <div class="menu-group">
    <button class="menu-group-header" id="langHeader">
      <span id="langHeaderLabel">Language</span><span class="arrow">▾</span>
    </button>
    <div class="menu-options" id="langList"></div>
  </div>
</div>

<div class="card">
  <img class="avatar reveal" style="animation-delay:.15s" src="avatar.jpg" alt="avatar">

  <p class="name reveal" style="animation-delay:.25s" id="typedName"><span class="cursor">&nbsp;</span></p>

  <p class="bio reveal" style="animation-delay:.33s" id="bioText">18 y/o · Hanoi<br>developer / gamer / designer</p>

  <div class="badges reveal" style="animation-delay:.4s">
    <span class="badge"><span class="dot"></span><span id="onlineLabel">online</span></span>
    <span class="badge">🇻🇳 VN</span>
  </div>

  <div class="links reveal" style="animation-delay:.5s">
    <a class="link" href="https://discord.com/users/000000000" target="_blank">Discord</a>
    <a class="link" href="https://instagram.com/username" target="_blank">Instagram</a>
    <a class="link" href="https://github.com/username" target="_blank">GitHub</a>
    <a class="link" href="https://tiktok.com/@username" target="_blank">TikTok</a>
  </div>

  <div class="music reveal" style="animation-delay:.6s">
    <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/5ioA8AWwBgqLx8h4tNCkqX?utm_source=generator" width="100%" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  </div>

  <p class="footer" id="footerText">made with ♥ on github pages</p>
  <p class="views" id="viewCount">views: —</p>
</div>

  const THEMES = {

      bg:"linear-gradient(160deg,#0c0c0c,#1a1a1a)",

      bg:"linear-gradient(160deg,#f4f8ff,#e4ecff,#ffffff)",

    "social-hub": { label:"Social Hub", font:"'Poppins', sans-serif",

    "creative-studio": { label:"Creative Studio", font:"'Fraunces', serif",
      bg:"linear-gradient(150deg,#fff4dc,#ffe0cc,#fdeecb)",
      panel:"rgba(255,255,255,0.55)", panelBorder:"rgba(20,184,166,0.4)", accent:"#14b8a6", accentDim:"#0d8f81",

    "modern-tech": { label:"Modern Tech", font:"'Sora', sans-serif",

      text:"#1e2233", textDim:"#767c94", radius:"14px", shadow:"0 8px 28px rgba(99,102,241,0.18)", blur:"10px" },

      nameSize:"12px", pixelated:true }

  const I18N = {
    en: { name:"English", bio:"18 y/o · Hanoi<br>developer / gamer / designer", online:"online",
      footer:"made with ♥ on github pages", views:"views: ", style:"Style", language:"Language" },
    vi: { name:"Tiếng Việt", bio:"18 tuổi · Hà Nội<br>developer / gamer / designer", online:"đang hoạt động",
      footer:"làm bằng ♥ trên github pages", views:"lượt xem: ", style:"Giao diện", language:"Ngôn ngữ" },

      footer:"สร้างด้วย ♥ บน github pages", views:"เข้าชม: ", style:"สไตล์", language:"ภาษา" },
    id: { name:"Bahasa Indonesia", bio:"18 tahun · Hanoi<br>developer / gamer / designer", online:"daring",
      footer:"dibuat dengan ♥ di github pages", views:"dilihat: ", style:"Gaya", language:"Bahasa" }
  };

  function applyTheme(id){
    const t = THEMES[id];
    if(!t) return;
    const r = document.documentElement.style;
    r.setProperty('--font', t.font);
    r.setProperty('--bg', t.bg);
    r.setProperty('--panel', t.panel);
    r.setProperty('--panel-border', t.panelBorder);
    r.setProperty('--accent', t.accent);
    r.setProperty('--accent-dim', t.accentDim);
    r.setProperty('--text', t.text);
    r.setProperty('--text-dim', t.textDim);
    r.setProperty('--radius', t.radius);
    r.setProperty('--shadow', t.shadow);
    r.setProperty('--blur', t.blur);
    r.setProperty('--border-style', t.borderStyle || 'solid');
    r.setProperty('--name-transform', t.transform || 'none');
    r.setProperty('--tracking', t.tracking || '1px');
    r.setProperty('--name-size', t.nameSize || '19px');
    r.setProperty('--img-render', t.pixelated ? 'pixelated' : 'auto');
    document.querySelectorAll('#themeList .menu-option').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.id === id);
    });
    localStorage.setItem('site_theme', id);
  }

  let currentViews = 0;
  function applyLanguage(code){
    const l = I18N[code] || I18N.en;
    document.documentElement.lang = code;
    document.getElementById('bioText').innerHTML = l.bio;
    document.getElementById('onlineLabel').textContent = l.online;
    document.getElementById('footerText').textContent = l.footer;
    document.getElementById('viewCount').textContent = l.views + currentViews;
    document.getElementById('styleHeaderLabel').textContent = l.style;
    document.getElementById('langHeaderLabel').textContent = l.language;
    document.querySelectorAll('#langList .menu-option').forEach(btn=>{
      btn.classList.toggle('active', btn.dataset.id === code);
    });
    localStorage.setItem('site_lang', code);
  }

  const themeListEl = document.getElementById('themeList');
  Object.keys(THEMES).forEach(id=>{
    const btn = document.createElement('button');
    btn.className = 'menu-option';
    btn.dataset.id = id;
    btn.textContent = THEMES[id].label;
    btn.onclick = ()=> applyTheme(id);
    themeListEl.appendChild(btn);
  });

  const langListEl = document.getElementById('langList');
  Object.keys(I18N).forEach(code=>{
    const btn = document.createElement('button');
    btn.className = 'menu-option';
    btn.dataset.id = code;
    btn.textContent = I18N[code].name;
    btn.onclick = ()=> applyLanguage(code);
    langListEl.appendChild(btn);
  });

  document.getElementById('menuBtn').onclick = ()=>{
    document.getElementById('menuPanel').classList.toggle('open');
  };

  function setupCollapsible(headerId, optionsId){
    const header = document.getElementById(headerId);
    const options = document.getElementById(optionsId);
    header.onclick = ()=>{
      header.classList.toggle('open');
      options.classList.toggle('open');
    };
  }
  setupCollapsible('styleHeader', 'themeList');
  setupCollapsible('langHeader', 'langList');

  const themeIds = Object.keys(THEMES);
  const savedTheme = localStorage.getItem('site_theme');
  applyTheme((savedTheme && THEMES[savedTheme]) ? savedTheme : themeIds[Math.floor(Math.random()*themeIds.length)]);

  const savedLang = localStorage.getItem('site_lang');
  const browserLang = (navigator.language || 'en').split('-')[0];
  applyLanguage((savedLang && I18N[savedLang]) ? savedLang : (I18N[browserLang] ? browserLang : 'en'));

  const nameText = "0SimpleCat";
  const nameEl = document.getElementById('typedName');
  let i = 0;
  function typeChar(){
    if(i < nameText.length){
      nameEl.insertBefore(document.createTextNode(nameText[i]), nameEl.lastElementChild);
      i++;
      setTimeout(typeChar, 90);
    }
  }
  setTimeout(typeChar, 250);

  currentViews = localStorage.getItem('bio_views');
  currentViews = currentViews ? parseInt(currentViews) + 1 : 1;
  localStorage.setItem('bio_views', currentViews);
  document.getElementById('viewCount').textContent = (I18N[document.documentElement.lang] || I18N.en).views + currentViews;
</script>

</body>
</html>
